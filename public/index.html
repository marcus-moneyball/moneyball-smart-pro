<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moneyball Analyser</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e7e9ee;
    --muted: #9aa0ac;
    --accent: #4f8cff;
    --accent-hover: #3f75e0;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 80px;
  }
  .container { max-width: 840px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }

  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; color: var(--muted); }
  input {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button {
    grid-column: 1 / -1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
  .status.error { color: var(--danger); }

  .results { margin-top: 28px; display: none; flex-direction: column; gap: 20px; }
  .results.visible { display: flex; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .card .content {
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  pre.json {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.4;
    max-height: 520px;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Moneyball Analyser</h1>
    <p class="subtitle">Validação de fluxo — coleta, normalização, investigação e os 3 artefatos de saída.</p>

    <form id="form-investigar">
      <div class="field">
        <label for="homeTeam">Time da casa</label>
        <input id="homeTeam" name="homeTeam" type="text" placeholder="Flamengo" required />
      </div>
      <div class="field">
        <label for="awayTeam">Time visitante</label>
        <input id="awayTeam" name="awayTeam" type="text" placeholder="Palmeiras" required />
      </div>
      <div class="field">
        <label for="competition">Competição</label>
        <input id="competition" name="competition" type="text" placeholder="Brasileirão" required />
      </div>
      <div class="field">
        <label for="date">Data</label>
        <input id="date" name="date" type="date" required />
      </div>
      <button type="submit" id="btn-investigar">Investigar</button>
    </form>

    <p id="status" class="status"></p>

    <div id="results" class="results">
      <div class="card">
        <h2>Resumo Executivo</h2>
        <div id="out-resumo" class="content"></div>
      </div>

      <div class="card">
        <h2>Card Telegram</h2>
        <div id="out-telegram" class="content"></div>
      </div>

      <div class="card">
        <h2>JSON MDM completo</h2>
        <pre id="out-mdm" class="json"></pre>
      </div>
    </div>
  </div>

  <script>
    const ENDPOINT = "/investigar";

    const form = document.getElementById("form-investigar");
    const btn = document.getElementById("btn-investigar");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const outResumo = document.getElementById("out-resumo");
    const outTelegram = document.getElementById("out-telegram");
    const outMdm = document.getElementById("out-mdm");

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function setLoading(loading) {
      btn.disabled = loading;
      btn.textContent = loading ? "Investigando..." : "Investigar";
    }

    // Extrai texto de saída dos builders com tolerância a formatos
    // diferentes (string pura ou objeto { texto } / { text }), sem
    // assumir estrutura fixa que ainda não foi confirmada.
    function extractText(value) {
      if (typeof value === "string") return value;
      if (value && typeof value === "object") {
        return value.texto ?? value.text ?? JSON.stringify(value, null, 2);
      }
      return "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        homeTeam: form.homeTeam.value.trim(),
        awayTeam: form.awayTeam.value.trim(),
        competition: form.competition.value.trim(),
        date: form.date.value
      };

      setLoading(true);
      setStatus("Executando Analyser (coleta → normalização → investigação → saída)...");
      resultsEl.classList.remove("visible");

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error || `Erro HTTP ${response.status}`);
        }

        outResumo.textContent = extractText(data.resumoExecutivo) || "(vazio)";
        outTelegram.textContent = extractText(data.cardTelegram) || "(vazio)";
        outMdm.textContent = JSON.stringify(data.mdm, null, 2);

        resultsEl.classList.add("visible");
        setStatus("Investigação concluída.");
      } catch (err) {
        setStatus(`Falha: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
