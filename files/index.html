<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moneyball Smart Pro — Painel</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151822;
    --panel-2: #1b1f2b;
    --border: #2a2f3d;
    --text: #e7e9ee;
    --muted: #939aab;
    --accent: #4f8cff;
    --accent-hover: #3f75e0;
    --green: #3ecf8e;
    --danger: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2036 0%, var(--bg) 55%);
    color: var(--text);
    padding: 28px 18px 80px;
  }
  .container { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }

  .pipeline-tag {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    margin-top: 10px;
  }
  .pipeline-tag b { color: var(--accent); font-weight: 600; }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* --- Triagem --- */
  .triagem-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover:not(:disabled) { border-color: var(--accent); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  button.is-loading .spinner { display: inline-block; }
  button.is-loading .btn-label { opacity: 0.8; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta-rodada { font-size: 0.8rem; color: var(--muted); margin-top: 12px; }

  .jogos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }

  .skeleton-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 150px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 0.9; } }

  .jogo-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .jogo-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .jogo-confronto { font-weight: 700; font-size: 1rem; line-height: 1.3; }
  .jogo-rank {
    flex-shrink: 0;
    background: rgba(79,140,255,0.15);
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .jogo-assimetria {
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .jogo-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: rgba(62,207,142,0.12);
    color: var(--green);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 0.68rem;
  }
  .jogo-card button { width: 100%; justify-content: center; margin-top: auto; }

  /* --- Form manual --- */
  .manual-toggle {
    background: none;
    color: var(--accent);
    padding: 0;
    font-size: 0.82rem;
    text-decoration: underline;
  }
  .manual-toggle:hover { background: none; opacity: 0.85; }

  form {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 16px;
  }
  form.visible { display: grid; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 0.78rem; color: var(--muted); }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.9rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  form button[type="submit"] { grid-column: 1 / -1; justify-content: center; }

  /* --- Status / erro --- */
  .status-line {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 10px;
  }
  .error-box {
    display: none;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.4);
    color: var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.85rem;
    margin-top: 12px;
  }
  .error-box.visible { display: block; }

  /* --- Resultados --- */
  #section-resultados { display: none; }
  #section-resultados.visible { display: block; }

  .resultados-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .resultado-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .resultado-card.full { grid-column: 1 / -1; }
  .resultado-card h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .resultado-card .content {
    white-space: pre-wrap;
    font-size: 0.9rem;
    line-height: 1.55;
  }
  pre.json {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 0.78rem;
    line-height: 1.4;
    max-height: 480px;
    overflow-y: auto;
    margin: 0;
  }

  .investigando-jogo {
    font-size: 0.82rem;
    color: var(--accent);
    margin-bottom: 10px;
  }

  @media (max-width: 720px) {
    .resultados-grid { grid-template-columns: 1fr; }
    form { grid-template-columns: 1fr; }
    .jogos-grid { grid-template-columns: 1fr; }
    .triagem-toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Moneyball Smart Pro</h1>
      <p>Triagem da rodada → Analyser → Resumo, Card e MDM.</p>
      <div class="pipeline-tag"><b>Triagem</b> → <b>Analyser</b> → BetBuilder <span style="opacity:0.6">(próxima etapa)</span></div>
    </header>

    <section id="section-triagem">
      <h2>1. Triagem da rodada</h2>
      <div class="triagem-toolbar">
        <button id="btn-carregar-rodada" type="button">
          <span class="spinner"></span>
          <span class="btn-label">Carregar Rodada</span>
        </button>
        <button id="btn-manual-toggle" type="button" class="secondary manual-toggle">Preencher jogo manualmente</button>
      </div>

      <p id="meta-rodada" class="meta-rodada"></p>
      <div id="erro-triagem" class="error-box"></div>
      <div id="jogos-grid" class="jogos-grid"></div>

      <form id="form-manual">
        <div class="field">
          <label for="homeTeam">Time da casa</label>
          <input id="homeTeam" name="homeTeam" type="text" placeholder="Flamengo" required />
        </div>
        <div class="field">
          <label for="awayTeam">Time visitante</label>
          <input id="awayTeam" name="awayTeam" type="text" placeholder="Palmeiras" required />
        </div>
        <div class="field">
          <label for="competition">Competição</label>
          <input id="competition" name="competition" type="text" placeholder="Brasileirão" required />
        </div>
        <div class="field">
          <label for="date">Data</label>
          <input id="date" name="date" type="date" required />
        </div>
        <button type="submit">
          <span class="spinner"></span>
          <span class="btn-label">Investigar</span>
        </button>
      </form>
    </section>

    <section id="section-resultados">
      <h2>2. Resultado do Analyser</h2>
      <p id="investigando-jogo" class="investigando-jogo"></p>
      <div id="erro-investigar" class="error-box"></div>
      <div class="resultados-grid">
        <div class="resultado-card">
          <h3>Resumo Executivo</h3>
          <div id="out-resumo" class="content"></div>
        </div>
        <div class="resultado-card">
          <h3>Card Telegram</h3>
          <div id="out-telegram" class="content"></div>
        </div>
        <div class="resultado-card full">
          <h3>JSON MDM completo</h3>
          <pre id="out-mdm" class="json"></pre>
        </div>
      </div>
    </section>
  </div>

  <script>
    const TRIAGEM_ENDPOINT = "/triagem";
    const INVESTIGAR_ENDPOINT = "/investigar";

    const btnCarregarRodada = document.getElementById("btn-carregar-rodada");
    const btnManualToggle = document.getElementById("btn-manual-toggle");
    const metaRodada = document.getElementById("meta-rodada");
    const erroTriagem = document.getElementById("erro-triagem");
    const jogosGrid = document.getElementById("jogos-grid");
    const formManual = document.getElementById("form-manual");

    const sectionResultados = document.getElementById("section-resultados");
    const investigandoJogo = document.getElementById("investigando-jogo");
    const erroInvestigar = document.getElementById("erro-investigar");
    const outResumo = document.getElementById("out-resumo");
    const outTelegram = document.getElementById("out-telegram");
    const outMdm = document.getElementById("out-mdm");

    let rodadaAtual = null;
    let requisicaoEmAndamento = false;

    // ---------- helpers ----------

    function setButtonLoading(btn, loading, labelLoading, labelIdle) {
      btn.disabled = loading;
      btn.classList.toggle("is-loading", loading);
      const label = btn.querySelector(".btn-label");
      if (label) label.textContent = loading ? labelLoading : labelIdle;
    }

    function showError(el, message) {
      el.textContent = message;
      el.classList.add("visible");
    }

    function hideError(el) {
      el.textContent = "";
      el.classList.remove("visible");
    }

    function setAllInvestigarButtonsDisabled(disabled) {
      document.querySelectorAll("[data-investigar-btn]").forEach((btn) => {
        btn.disabled = disabled;
      });
    }

    // Extrai { homeTeam, awayTeam } de "Time A x Time B".
    function parseConfronto(confronto) {
      const partes = (confronto || "").split(/\s+x\s+/i);
      return {
        homeTeam: (partes[0] || "").trim(),
        awayTeam: (partes[1] || "").trim()
      };
    }

    // Nome curto da competição a partir do texto livre de "rodada".
    function extractCompeticao(rodada) {
      if (!rodada) return "";
      return rodada.split(" - ")[0].trim();
    }

    const MESES = {
      janeiro: "01", fevereiro: "02", março: "03", marco: "03", abril: "04",
      maio: "05", junho: "06", julho: "07", agosto: "08", setembro: "09",
      outubro: "10", novembro: "11", dezembro: "12"
    };

    // Tenta extrair uma data ISO a partir do texto livre de "rodada"
    // (ex: "... 05 e 06 de Agosto ..." + "Copa do Brasil 2026" -> pega
    // o primeiro dia mencionado + o primeiro ano de 4 dígitos). Se não
    // conseguir, devolve "" e o usuário confirma manualmente.
    function extractDataFromRodada(rodada) {
      if (!rodada) return "";
      const diaMes = rodada.match(/(\d{1,2})\s+de\s+([a-zçãéô]+)/i);
      const ano = rodada.match(/\b(20\d{2})\b/);
      if (!diaMes || !ano) return "";
      const mes = MESES[diaMes[2].toLowerCase()];
      if (!mes) return "";
      const dia = diaMes[1].padStart(2, "0");
      return `${ano[1]}-${mes}-${dia}`;
    }

    function buildMatchInputFromJogo(jogo) {
      const { homeTeam, awayTeam } = parseConfronto(jogo.confronto);
      return {
        homeTeam,
        awayTeam,
        competition: extractCompeticao(rodadaAtual?.rodada),
        date: extractDataFromRodada(rodadaAtual?.rodada)
      };
    }

    // ---------- Triagem ----------

    function renderSkeletons(qtd = 4) {
      jogosGrid.innerHTML = "";
      for (let i = 0; i < qtd; i++) {
        const el = document.createElement("div");
        el.className = "skeleton-card";
        jogosGrid.appendChild(el);
      }
    }

    function renderJogos(jogos) {
      jogosGrid.innerHTML = "";

      if (!Array.isArray(jogos) || jogos.length === 0) {
        jogosGrid.innerHTML = '<p class="status-line">Nenhum jogo candidato retornado nesta rodada.</p>';
        return;
      }

      jogos.forEach((jogo) => {
        const card = document.createElement("div");
        card.className = "jogo-card";

        const tags = (jogo.hipoteses ?? []).map((h) => `<span class="tag">${h}</span>`).join("");

        card.innerHTML = `
          <div class="jogo-header">
            <span class="jogo-confronto">${jogo.confronto ?? ""}</span>
            <span class="jogo-rank">#${jogo.rank ?? "-"}</span>
          </div>
          <div class="jogo-assimetria">${jogo.assimetria_detectada ?? ""}</div>
          <div class="jogo-tags">${tags}</div>
          <button type="button" data-investigar-btn>
            <span class="spinner"></span>
            <span class="btn-label">Investigar</span>
          </button>
        `;

        const btn = card.querySelector("[data-investigar-btn]");
        btn.addEventListener("click", () => {
          const matchInput = buildMatchInputFromJogo(jogo);

          if (!matchInput.date) {
            // Não deu pra inferir a data — abre o form manual já
            // preenchido pra o usuário confirmar antes de investigar.
            formManual.classList.add("visible");
            formManual.homeTeam.value = matchInput.homeTeam;
            formManual.awayTeam.value = matchInput.awayTeam;
            formManual.competition.value = matchInput.competition;
            formManual.date.focus();
            formManual.scrollIntoView({ behavior: "smooth", block: "start" });
            return;
          }

          investigar(matchInput, { jogoLabel: jogo.confronto, triggerBtn: btn });
        });

        jogosGrid.appendChild(card);
      });
    }

    async function carregarRodada() {
      setButtonLoading(btnCarregarRodada, true, "Carregando...", "Carregar Rodada");
      hideError(erroTriagem);
      metaRodada.textContent = "";
      renderSkeletons();

      try {
        const response = await fetch(TRIAGEM_ENDPOINT);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error || `Erro HTTP ${response.status}`);
        }

        rodadaAtual = data;
        const total = data.total_jogos_selecionados ?? (data.jogos || []).length;
        metaRodada.textContent = `${data.rodada ?? ""} — ${total} jogo(s) selecionado(s)`;
        renderJogos(data.jogos);
      } catch (err) {
        jogosGrid.innerHTML = "";
        showError(erroTriagem, `Falha ao carregar a rodada: ${err.message}`);
      } finally {
        setButtonLoading(btnCarregarRodada, false, "Carregando...", "Carregar Rodada");
      }
    }

    btnCarregarRodada.addEventListener("click", carregarRodada);

    // ---------- Form manual ----------

    btnManualToggle.addEventListener("click", () => {
      formManual.classList.toggle("visible");
      if (formManual.classList.contains("visible")) {
        formManual.homeTeam.focus();
      }
    });

    formManual.addEventListener("submit", (event) => {
      event.preventDefault();
      const matchInput = {
        homeTeam: formManual.homeTeam.value.trim(),
        awayTeam: formManual.awayTeam.value.trim(),
        competition: formManual.competition.value.trim(),
        date: formManual.date.value
      };
      investigar(matchInput, {
        jogoLabel: `${matchInput.homeTeam} x ${matchInput.awayTeam}`,
        triggerBtn: formManual.querySelector('button[type="submit"]')
      });
    });

    // ---------- Investigar (Analyser) ----------

    async function investigar(matchInput, { jogoLabel, triggerBtn } = {}) {
      if (requisicaoEmAndamento) return;
      requisicaoEmAndamento = true;

      setAllInvestigarButtonsDisabled(true);
      if (triggerBtn) setButtonLoading(triggerBtn, true, "Investigando...", "Investigar");
      hideError(erroInvestigar);

      sectionResultados.classList.add("visible");
      investigandoJogo.textContent = `Investigando: ${jogoLabel ?? `${matchInput.homeTeam} x ${matchInput.awayTeam}`}...`;
      outResumo.textContent = "";
      outTelegram.textContent = "";
      outMdm.textContent = "";
      sectionResultados.scrollIntoView({ behavior: "smooth", block: "start" });

      try {
        const response = await fetch(INVESTIGAR_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(matchInput)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error || `Erro HTTP ${response.status}`);
        }

        investigandoJogo.textContent = `Concluído: ${jogoLabel ?? `${matchInput.homeTeam} x ${matchInput.awayTeam}`}`;
        outResumo.textContent = extractText(data.resumoExecutivo) || "(vazio)";
        outTelegram.textContent = extractText(data.cardTelegram) || "(vazio)";
        outMdm.textContent = JSON.stringify(data.mdm, null, 2);
      } catch (err) {
        investigandoJogo.textContent = "";
        showError(erroInvestigar, `Falha ao investigar: ${err.message}`);
      } finally {
        requisicaoEmAndamento = false;
        setAllInvestigarButtonsDisabled(false);
        if (triggerBtn) setButtonLoading(triggerBtn, false, "Investigando...", "Investigar");
      }
    }

    // Tolerante a builders devolvendo string pura ou { texto } / { text }.
    function extractText(value) {
      if (typeof value === "string") return value;
      if (value && typeof value === "object") {
        return value.texto ?? value.text ?? JSON.stringify(value, null, 2);
      }
      return "";
    }
  </script>
</body>
</html>
